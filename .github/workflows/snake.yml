name: Generate Snake Animation

on:
  schedule:
    # Runs at 00:00 UTC every day (8:00 AM Shanghai time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CelesteXiao
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Move SVG to root
        run: |
          mv dist/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
          mv dist/github-contribution-grid-snake-dark.svg ./github-contribution-grid-snake-dark.svg

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update snake animation"
          git push

      - name: Cleanup
        if: always()
        run: |
          rm -rf dist